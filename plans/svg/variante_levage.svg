<svg xmlns="http://www.w3.org/2000/svg" width="119mm" height="76mm" viewBox="0 0 119 76" role="img" aria-labelledby="titre description"><title id="titre">WARABA — VARIANTE P3 · remplace 08</title><desc id="description">Origine O au sol, dans le plan de symétrie, à l'arrière du pare-chocs. X vers l'avant, Y vers la gauche, Z vers le haut. Modèle visuel conceptuel d'encombrement. Ce n'est pas une CAO de fabrication : aucun perçage, ajustement ni matériau définitif. Échelle commune 1:2,5 ; dimensions en mm, statuts selon le JSON. Module avant : enveloppe réservée, non détaillé. Platines trapézoïdales ajourées symétriques. Pare-chocs bleu Z 10–24, noir jusqu’à 42. Capot retiré du dessus et de l’axonométrie, contour fantôme avec 7 ouïes par côté, largeur 2, pas 7.</desc><defs>
